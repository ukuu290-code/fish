<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080e1e">
  <meta name="description" content="魚を操作して敵やボスを倒すシューティングゲーム。">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FISH STRIKER</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22%2365dcb9%22/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="app-icon-192.png">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 12px 12px 20px;
      background:
        radial-gradient(ellipse at 50% 35%, rgba(34, 72, 112, 0.2), transparent 55%),
        #080e1e;
      color: #aebfd0;
      font: 13px/1.7 system-ui, "Yu Gothic UI", sans-serif;
      text-align: center;
    }

    canvas {
      display: block;
      width: min(100%, 700px) !important;
      height: auto !important;
      margin: 0 auto;
      touch-action: none;
      border: 1px solid rgba(106, 184, 225, 0.25);
      border-radius: 10px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.38), 0 0 28px rgba(46, 143, 210, 0.08);
    }

    .controls {
      width: min(100%, 700px);
      margin: 12px auto 0;
      padding: 10px 14px;
      border: 1px solid rgba(106, 184, 225, 0.18);
      border-radius: 10px;
      background: rgba(13, 25, 44, 0.82);
      color: #b9cadd;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px 14px;
    }

    .control-row + .control-row {
      margin-top: 6px;
      padding-top: 7px;
      border-top: 1px solid rgba(106, 184, 225, 0.12);
    }

    .control {
      white-space: nowrap;
    }

    .touch-controls {
      display: none;
      width: min(100%, 700px);
      margin: 10px auto 0;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .touch-button,
    .install-button {
      min-height: 52px;
      border: 1px solid rgba(106, 184, 225, 0.36);
      border-radius: 10px;
      background: linear-gradient(180deg, #1a3049, #102036);
      color: #e4f2ff;
      font: 700 16px/1.2 system-ui, "Yu Gothic UI", sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .touch-button:active,
    .touch-button.is-pressed {
      background: #236080;
      border-color: #65dcb9;
      transform: translateY(1px);
    }

    .touch-button--action {
      border-color: rgba(101, 220, 185, 0.55);
      color: #91f4d5;
    }

    .install-help {
      margin-top: 8px;
      color: #879eb5;
      font-size: 12px;
    }

    .install-button {
      min-height: 40px;
      margin-top: 8px;
      padding: 0 16px;
      border-color: rgba(101, 220, 185, 0.55);
      color: #91f4d5;
      cursor: pointer;
      touch-action: manipulation;
    }

    .save-button {
      display: block;
      width: min(100%, 600px);
      min-height: 40px;
      margin: 10px auto 0;
      padding: 0 16px;
      border: 1px solid rgba(101, 220, 185, 0.55);
      border-radius: 10px;
      background: linear-gradient(180deg, #16433f, #102e35);
      color: #91f4d5;
      font: 700 14px/1.2 system-ui, "Yu Gothic UI", sans-serif;
      cursor: pointer;
      touch-action: manipulation;
    }

    .save-button:active {
      background: #236080;
      transform: translateY(1px);
    }

    [hidden] {
      display: none !important;
    }

    kbd {
      display: inline-block;
      min-width: 1.8em;
      padding: 1px 6px;
      border: 1px solid #40556c;
      border-bottom-width: 2px;
      border-radius: 5px;
      background: #17263a;
      color: #e4f2ff;
      font: 600 0.92em/1.6 ui-monospace, monospace;
    }

    @media (max-width: 480px) {
      body {
        padding: 8px 8px 14px;
      }

      canvas {
        border-radius: 7px;
      }

      .controls {
        margin-top: 8px;
        padding: 9px 8px;
        font-size: 12px;
      }

      .control-row {
        gap: 6px 10px;
      }

      .control {
        white-space: normal;
      }

      .touch-controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 800px), (pointer: coarse) {
      .touch-controls {
        display: grid;
      }
    }
  </style>
  <script src="library/p5.min.js"></script>
  <script src="code.js"></script>
  <script src="app.js" defer></script>
</head>

<body>
  <div class="touch-controls" role="group" aria-label="タッチ操作">
    <button class="touch-button" type="button" data-game-control="left" aria-label="左へ移動">◀</button>
    <button class="touch-button" type="button" data-game-control="right" aria-label="右へ移動">▶</button>
    <button class="touch-button touch-button--action" type="button" data-game-control="shoot" aria-label="ショット">ショット</button>
    <button class="touch-button touch-button--action" type="button" data-game-control="beam" aria-label="ビームをチャージ">ビーム</button>
  </div>
  <button class="save-button" type="button" data-game-save aria-label="ゲームをセーブ" aria-live="polite">セーブ</button>
  <section class="controls" aria-label="操作方法">
    <div class="control-row">
      <span class="control"><kbd>←</kbd> <kbd>→</kbd> 移動</span>
      <span class="control"><kbd>SPACE</kbd> / <kbd>Z</kbd> ショット</span>
      <span class="control"><kbd>B</kbd> 長押し ビーム</span>
    </div>
    <div class="control-row">
      <span class="control"><kbd>ENTER</kbd> 続きから / <kbd>N</kbd> はじめから</span>
      <span class="control"><kbd>1</kbd>–<kbd>4</kbd> / クリック 強化</span>
      <span class="control"><kbd>L</kbd> 難易度</span>
      <span class="control"><kbd>R</kbd> やり直し</span>
      <span class="control"><kbd>X</kbd> デバッグ</span>
    </div>
    <p class="install-help">Android: Chrome で開き、メニューから「アプリをインストール」を選ぶとホーム画面に追加できます。</p>
    <button class="install-button" id="install-app" type="button" hidden>アプリをインストール</button>
  </section>
</body>

</html>
